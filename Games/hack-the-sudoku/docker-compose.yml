services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hack-the-sudoku-api
    ports:
      - "8080:8080"
    environment:
      COMPOSE_HINT: "Check service names and exposed debug endpoint."

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: "http://backend:8080"
        VITE_HACKME_BASE: "http://localhost/HackMe"
    container_name: hack-the-sudoku-web
    ports:
      - "4011:80"
    depends_on:
      - backend
