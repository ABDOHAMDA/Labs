services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hack-the-sudoku-api
    # 8080 على ويندوز غالباً محجوز (XAMPP/Apache) — نفتح API على 18080 للمضيف
    ports:
      - "18080:8080"
    environment:
      COMPOSE_HINT: "Check service names and exposed debug endpoint."

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # يُبنى في Vite: المتصفح يستدعي المضيف، ليس اسم خدمة Docker
        VITE_API_BASE: "http://localhost:18080"
        VITE_HACKME_BASE: "http://localhost/HackMe"
    container_name: hack-the-sudoku-web
    ports:
      - "4011:80"
    depends_on:
      - backend
